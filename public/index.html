<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EOD Watch — Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- TradingView Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root{--bg:#0e1a24;--panel:#0f1b2b;--border:#1f2937;--text:#cbd5e1;--muted:#94a3b8;--accent:#3b82f6;--good:#4ade80;--bad:#ef4444;--warn:#f59e0b}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--border);background:linear-gradient(#0f1b2b,#0e1a24)}
    input,button{background:#0b1522;border:1px solid #22314a;color:var(--text);border-radius:8px;padding:8px 10px}
    button{cursor:pointer}
    button.primary{background:var(--accent);border-color:var(--accent);color:white}
    .btn-toggle.active{outline:2px solid var(--accent)}
    .toolbar-sep{width:1px;height:24px;background:var(--border);margin:0 6px}
    main{display:grid;grid-template-columns:1fr 320px;gap:10px;padding:10px;height:calc(100% - 56px)}
    #board{grid-column:1/3;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
    #board-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .mini{position:relative;background:#0f1b2b;border:1px solid var(--border);border-radius:8px;height:160px;overflow:hidden}
    .mini .title{position:absolute;left:6px;top:4px;font-size:12px;color:var(--muted)}
    .mini .enlarge{position:absolute;right:4px;top:4px;font-size:12px;padding:2px 6px;background:rgba(0,0,0,0.3);border-radius:4px;cursor:pointer}
    #chart{background:var(--panel);border:1px solid var(--border);border-radius:10px;min-height:520px;position:relative}
    .drawing-mode #chart { cursor: crosshair; }
    .loading-overlay { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(14,26,36,0.8); display:none; align-items:center; justify-content:center; color:#60a5fa; font-size:14px; border-radius:10px; }
    .loading-overlay.show { display:flex; }
    aside{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;overflow:auto}
    h3{margin:.25rem 0 .5rem 0;font-size:13px;color:var(--muted)}
    .list .row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed #20304a}
    .row:hover{background:#0f1724}
    .row.selected{background:#1e3a8a20;border-left:3px solid #3b82f6}
    
    /* Enhanced level styling */
    .level-item .level-content{display:flex;align-items:center;gap:8px;flex:1}
    .level-price{font-weight:500}
    .level-color{width:12px;height:12px;border-radius:50%;border:1px solid #374151}
    
    /* Enhanced trendline styling */
    .trendline-item .trendline-content{display:flex;flex-direction:column;gap:2px;flex:1}
    .trendline-dates{font-size:11px;color:#64748b}
    .trendline-prices{font-size:12px;font-weight:500}
    .trendline-color{width:12px;height:3px;border-radius:2px;align-self:flex-start;margin-top:2px}
    
    .kill{background:transparent;border:none;color:#f87171;cursor:pointer;font-size:16px}
    .status{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0b1524;border:1px solid #22314a;border-radius:8px;padding:8px;white-space:pre-wrap;min-height:38px}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chip{padding:3px 6px;border-radius:999px;border:1px solid var(--border);font-size:12px}
    .chip.good{border-color:#236a4d;color:#9ce8c0}
    .chip.bad{border-color:#632828;color:#f3b0b0}
    .chip.warn{border-color:#5a4517;color:#f6d399}

    /* Watchlist styles (enhanced) */
    #watchlist-section { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:10px; }
    #add-symbol { display:flex; gap:4px; margin-bottom:8px; }
    #new-symbol { flex:1; }
    .symbol-item { padding:8px; cursor:pointer; border-bottom:1px dashed #20304a; display:flex; justify-content:space-between; align-items:center; border-radius:4px; margin-bottom:2px; }
    .symbol-item:hover { background:#1e293b; }
    .symbol-item.active { background:var(--accent); color:white; }
    .symbol-name { font-weight:500; }
    .remove-btn { background:var(--bad); font-size:12px; padding:2px 6px; border-radius:3px; border:none; color:white; }

    /* Watchlist Board - Mini Chart Dashboard */
    #watchlist-board-section { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:10px; }
    #watchlist-board { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:8px; margin-top:10px; }
    .mini-chart-container { 
      background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px; 
      cursor:pointer; transition:all 0.2s ease; position:relative; min-height:120px;
    }
    .mini-chart-container:hover { border-color:var(--accent); box-shadow:0 2px 8px rgba(59,130,246,0.2); }
    .mini-chart-container.active { border-color:var(--accent); background:rgba(59,130,246,0.1); }
    .mini-chart-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .mini-chart-symbol { font-weight:bold; font-size:12px; color:var(--text); }
    .mini-chart-price { font-size:11px; color:var(--text-muted); }
    .mini-chart-change { font-size:10px; font-weight:bold; }
    .mini-chart-change.positive { color:#10b981; }
    .mini-chart-change.negative { color:#ef4444; }
    .mini-chart { width:100%; height:80px; }
    .mini-chart-loading { 
      display:flex; align-items:center; justify-content:center; height:80px; 
      color:var(--text-muted); font-size:11px; 
    }

    /* Enhanced Drawing Tools */
    .tool-section { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:10px; }
    .tool-btn { background:#374151; color:var(--text); border:0; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; margin-right:6px; margin-bottom:4px; }
    .tool-btn.active { background:var(--accent); box-shadow:0 0 8px rgba(59,130,246,0.4); }
    .tool-btn:hover { transform:translateY(-1px); transition:transform 0.1s; }

    /* Enhanced Indicators */
    .indicator-toggle { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px; }
    .toggle-switch { width:36px; height:18px; background:#374151; border-radius:10px; position:relative; cursor:pointer; transition:background 0.2s; }
    .toggle-switch.active { background:var(--accent); }
    .toggle-knob { width:14px; height:14px; background:#fff; border-radius:50%; position:absolute; top:2px; left:2px; transition:left 0.2s; }
    .toggle-switch.active .toggle-knob { left:20px; }

    /* Modal */
    #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:50;align-items:center;justify-content:center}
    #modal .box{position:relative;width:92vw;height:86vh;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
    #modal .close{position:absolute;right:10px;top:8px;z-index:2;background:var(--bad);color:white;border:none;border-radius:4px;padding:4px 8px;cursor:pointer}

    /* Status indicators */
    .status-dot { width:8px; height:8px; border-radius:50%; margin-right:6px; }
    .status-connected { background:var(--good); }
    .status-loading { background:var(--warn); animation:pulse 1.5s infinite; }
    .status-error { background:var(--bad); }
    @keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:0.5; } }

    /* Line Controls (enhanced) */
    #line-controls { display:none; margin-top:10px; }
    .color-picker { display:flex; gap:6px; margin:6px 0; }
    .color-option { width:24px; height:24px; border-radius:6px; cursor:pointer; border:2px solid transparent; transition:transform 0.1s; }
    .color-option.active { border-color:var(--accent); }
    .color-option:hover { transform:scale(1.1); }

    /* Context Menu Styling */
    #contextMenu {
      position: fixed;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      min-width: 200px;
      padding: 6px 0;
      display: none;
      font-size: 13px;
    }
    
    .context-menu-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text);
      width: 100%;
      text-align: left;
      gap: 8px;
      transition: background-color 0.1s ease;
    }
    
    .context-menu-item:hover {
      background: rgba(59, 130, 246, 0.15);
    }
    
    .context-menu-item:active {
      background: rgba(59, 130, 246, 0.25);
    }
    
    .context-menu-item.destructive {
      color: var(--bad);
    }
    
    .context-menu-item.destructive:hover {
      background: rgba(239, 68, 68, 0.15);
    }
    
    .context-menu-separator {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }
    
    .context-menu-icon {
      font-size: 14px;
      width: 16px;
      text-align: center;
    }
    
    .context-menu-label {
      flex: 1;
    }
    
    .context-menu-value {
      color: var(--muted);
      font-size: 12px;
    }

    /* Alert Dialog Styling */
    .alert-dialog-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    
    .alert-dialog-overlay.show {
      display: flex;
    }
    
    .alert-dialog {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
      width: 420px;
      max-width: 90vw;
      font-size: 14px;
      transform: scale(1);
      transition: none;
    }
    
    .alert-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    
    .alert-dialog-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    
    .alert-dialog-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background-color 0.1s ease;
    }
    
    .alert-dialog-close:hover {
      background: rgba(239, 68, 68, 0.15);
      color: var(--bad);
    }
    
    .alert-dialog-content {
      padding: 20px;
    }
    
    .alert-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 12px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
    }
    
    .alert-for-label {
      color: var(--muted);
      font-size: 13px;
    }
    
    .alert-target-info {
      color: var(--text);
      font-weight: 500;
    }
    
    .alert-direction-label {
      color: var(--text);
      font-weight: 500;
      margin-bottom: 12px;
    }
    
    .alert-direction-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .alert-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.1s ease;
      background: rgba(15, 27, 43, 0.5);
    }
    
    .alert-option:hover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.05);
    }
    
    .alert-option input[type="radio"] {
      margin: 0;
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }
    
    .alert-option input[type="radio"]:checked + .alert-option-text {
      color: var(--accent);
    }
    
    .alert-option-text {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      color: var(--text);
    }
    
    .alert-direction-text {
      font-weight: 500;
    }
    
    .alert-price {
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    
    .alert-dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }
    
    .alert-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.1s ease;
      border: 1px solid transparent;
    }
    
    .alert-btn-cancel {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }
    
    .alert-btn-cancel:hover {
      background: rgba(148, 163, 184, 0.1);
      color: var(--text);
    }
    
    .alert-btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    .alert-btn-primary:hover {
      background: #2563eb;
      border-color: #2563eb;
    }
    
    .alert-btn-primary:disabled {
      background: #374151;
      border-color: #374151;
      color: #6b7280;
      cursor: not-allowed;
    }

    /* Responsive */
    @media (max-width: 1200px) {
      main { grid-template-columns:1fr 280px; }
      #board-grid { grid-template-columns:repeat(4,1fr); }
    }
    @media (max-width: 900px) {
      main { grid-template-columns:1fr; }
      aside { order:-1; }
      #board { display:none; }
      .alert-dialog {
        width: 350px;
      }
    }

  </style>
</head>
<body>
  <header>
    <input id="ticker" placeholder="AAPL" value="AAPL" />
    <button id="btnLoad" class="primary">Load</button>
    <div class="toolbar-sep"></div>
    <button class="tf btn-toggle" data-tf="4H">4H</button>
    <button class="tf btn-toggle active" data-tf="1D">1D</button>
    <button class="tf btn-toggle" data-tf="1W">1W</button>
    <button class="tf btn-toggle" data-tf="1M">1M</button>
    <div class="toolbar-sep"></div>
    <button id="toolLevel" class="btn-toggle">+ Level</button>
    <button id="toolTrend" class="btn-toggle">+ Trend (2-click)</button>
    <div class="toolbar-sep"></div>
    <button id="toggleEMA" class="btn-toggle">EMA200</button>
    <button id="toggleBB" class="btn-toggle">BB(20,2)</button>
    <div class="toolbar-sep"></div>
    <div id="testbox" style="display:flex; gap:6px; align-items:center;">
      <span style="opacity:.7">Test Mode:</span>
      <button id="testInit">Initialize</button>
      <button id="testStart">Start</button>
      <button id="testStep">Step</button>
      <button id="testStop">Stop</button>
      <button id="testReset">Reset</button>
      <div class="toolbar-sep"></div>
      <button id="testSlower">Slower</button>
      <span id="speedDisplay" style="min-width:60px; text-align:center; font-size:12px; color:var(--muted)">1.0x</span>
      <button id="testFaster">Faster</button>
    </div>
    <div class="toolbar-sep"></div>
    <div style="display:flex; align-items:center;">
      <div class="status-dot status-connected" id="status-dot"></div>
      <span id="topStatus" style="margin-left:6px;color:var(--muted)">Ready</span>
    </div>
  </header>

  <main>
    <!-- 10-chart board -->
    <section id="board">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="color:var(--muted);font-size:13px">WATCHLIST BOARD</div>
        <div id="boardHint" style="color:var(--muted);font-size:12px">Click mini to load main · ⤢ to enlarge</div>
      </div>
      <div id="board-grid"></div>
    </section>

    <!-- main chart -->
    <section id="chart">
      <div class="loading-overlay" id="loading-overlay">
        <div>Loading chart data...</div>
      </div>
      <!-- ISOLATED DRAWING OVERLAY - Completely independent from chart series -->
      <canvas id="drawing-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none;"></canvas>
    </section>

    <!-- side panel -->
    <aside>
      <div id="watchlist-section">
        <h3>WATCHLIST</h3>
        <div id="add-symbol">
          <input id="new-symbol" placeholder="Add symbol..." />
          <button id="add-btn">+</button>
        </div>
        <div id="watchlist"></div>
      </div>

      <div id="watchlist-board-section">
        <h3>MARKET BOARD</h3>
        <div id="watchlist-board"></div>
      </div>

      <div class="tool-section">
        <h3>INDICATORS</h3>
        <div class="indicator-toggle">
          <div class="toggle-switch active" id="ema-toggle">
            <div class="toggle-knob"></div>
          </div>
          <span>EMA(200)</span>
        </div>
        <div class="indicator-toggle">
          <div class="toggle-switch" id="bb-toggle">
            <div class="toggle-knob"></div>
          </div>
          <span>BB(20,2)</span>
        </div>
      </div>

      <div class="tool-section">
        <h3>DRAWING TOOLS</h3>
        <button class="tool-btn" id="level-tool">Level</button>
        <button class="tool-btn" id="trendline-tool">Trendline</button>
        <button class="tool-btn" id="clear-all">Clear All</button>
        
        <div id="line-controls">
          <h3>LINE OPTIONS</h3>
          <div class="color-picker">
            <div class="color-option" style="background:#60a5fa" data-color="#60a5fa" title="Blue"></div>
            <div class="color-option" style="background:#f59e0b" data-color="#f59e0b" title="Orange"></div>
            <div class="color-option" style="background:#10b981" data-color="#10b981" title="Green"></div>
            <div class="color-option" style="background:#ef4444" data-color="#ef4444" title="Red"></div>
            <div class="color-option" style="background:#8b5cf6" data-color="#8b5cf6" title="Purple"></div>
            <div class="color-option" style="background:#f97316" data-color="#f97316" title="Yellow"></div>
          </div>
          <button class="tool-btn" id="delete-line" style="background:var(--bad); width:100%; margin-top:4px;">Delete Selected Line</button>
        </div>
      </div>

      <div>
        <h3>Signals</h3>
        <div id="chips" class="chips"></div>
      </div>
      
      <div>
        <h3>Levels</h3>
        <div id="levels" class="list"></div>
      </div>
      
      <div>
        <h3>Trendlines</h3>
        <div id="trends" class="list"></div>
      </div>
      
      <div>
        <h3>Log</h3>
        <div id="log" class="status">—</div>
      </div>
    </aside>
  </main>

  <!-- fullscreen modal -->
  <div id="modal">
    <div class="box">
      <button class="close">✕</button>
      <div id="modalCanvas" style="position:absolute;inset:0"></div>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="contextMenu">
    <!-- Menu items will be dynamically populated -->
  </div>

  <!-- Alert Direction Dialog -->
  <div id="alertDialog" class="alert-dialog-overlay">
    <div class="alert-dialog">
      <div class="alert-dialog-header">
        <h3>Alert Setup</h3>
        <button class="alert-dialog-close">&times;</button>
      </div>
      <div class="alert-dialog-content">
        <div class="alert-info">
          <span class="alert-for-label">For:</span>
          <span id="alertTargetInfo" class="alert-target-info"></span>
        </div>
        <div class="alert-direction">
          <div class="alert-direction-label">Direction:</div>
          <div class="alert-direction-options">
            <label class="alert-option">
              <input type="radio" name="alertDirection" value="above" />
              <span class="alert-option-text">
                <span class="alert-direction-text">Close Above</span>
                <span id="alertPriceAbove" class="alert-price"></span>
              </span>
            </label>
            <label class="alert-option">
              <input type="radio" name="alertDirection" value="below" />
              <span class="alert-option-text">
                <span class="alert-direction-text">Close Below</span>
                <span id="alertPriceBelow" class="alert-price"></span>
              </span>
            </label>
          </div>
        </div>
      </div>
      <div class="alert-dialog-footer">
        <button id="alertCancelBtn" class="alert-btn alert-btn-cancel">Cancel</button>
        <button id="alertSetBtn" class="alert-btn alert-btn-primary">Set Alert</button>
      </div>
    </div>
  </div>


<script>
(function () {
  const API = ''; // same origin
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);
  const log = m => { $('#log').textContent = m; console.log('[EOD]', m); };

  // ---- Application State with safe migration
  // One-time migration cleanup (only run once to prevent data loss)
  const migrationVersion = localStorage.getItem('eod-migration-version');
  if (!migrationVersion || migrationVersion < '2.0') {
    console.log('[EOD] Running one-time migration - upgrading data format');
    localStorage.removeItem('eod-levels');
    localStorage.removeItem('eod-trendlines');
    localStorage.setItem('eod-migration-version', '2.0');
  }

  // Global state for signal detection system
  let tfBars = [];  // Current timeframe bars for signal evaluation
  
  let watchlist = JSON.parse(localStorage.getItem('eod-watchlist') || '["AAPL", "META", "TSLA", "GOOGL", "MSFT"]');
  let currentSymbol = localStorage.getItem('eod-current-symbol') || 'AAPL';

      if (logical === null || logical === undefined || !Number.isFinite(logical)) {
        return null; // TradingView API legitimately returns null for invalid coordinates
      }
      return logical;
    } catch (error) {
      // Only log actual unexpected errors
      return null;
    }

  // ==== SCREEN-SPACE HIT TESTING FOR RELIABLE LINE SELECTION ====
  function dist2(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy; }
  function clamp01(t){ return t<0?0:t>1?1:t; }
  function pointSegDist(px,py, x1,y1, x2,y2){
    const A={x:x1,y:y1}, B={x:x2,y:y2}, P={x:px,y:py};
    const AB={x:B.x-A.x, y:B.y-A.y};
    const t = clamp01(((P.x-A.x)*AB.x + (P.y-A.y)*AB.y) / (AB.x*AB.x + AB.y*AB.y || 1));
    const proj = { x: A.x + t*AB.x, y: A.y + t*AB.y };
    return Math.sqrt(dist2(P, proj));
  }

  // ==== INDICATOR HIT TESTING ====
  function detectIndicatorClick(px, py, tolerancePx = 8) {
    console.log('[EOD] 🎯 Checking indicator click at', px, py, 'tolerance:', tolerancePx);
    
    if (!chart || !candleSeries) {
      console.log('[EOD] ❌ No chart or candleSeries');
      return null;
    }
    
    const price = candleSeries.coordinateToPrice(py);
    const time = chart.timeScale().coordinateToTime(px);
    
    if (!price || !time || !isFinite(price) || !isFinite(time) || 
        price === null || time === null) {
      console.log('[EOD] ❌ Invalid coordinates:', { price, time });
      return null;
    }
    
    console.log('[EOD] 📊 Indicators state - EMA:', indicators.ema200, 'BB:', indicators.bb20);
    
    // Check EMA(200) if visible - USE ACTUAL SERIES DATA
    if (indicators.ema200 && emaSeries) {
      try {
        // Get EMA value at this time by finding the closest bar
        const emaData = emaSeries.data();
        if (emaData && emaData.length > 0) {
          // Find closest EMA point by time
          const emaPoint = emaData.reduce((closest, current) => {
            const currentDiff = Math.abs(current.time - time);
            const closestDiff = Math.abs(closest.time - time);
            return currentDiff < closestDiff ? current : closest;
          });
          
          if (emaPoint && Math.abs(emaPoint.time - time) <= 86400) { // within 1 day
            const emaY = candleSeries.priceToCoordinate(emaPoint.value);
            if (emaY !== null && Math.abs(py - emaY) <= tolerancePx) {
              console.log('[EOD] ✅ EMA hit detected at', emaPoint.value);
              return { type: 'ema', value: emaPoint.value, name: 'EMA(200)', period: 200 };
            }
          }
        }
      } catch (error) {
        console.log('[EOD] ⚠️ EMA detection error:', error);
      }
    }
    
    // Check Bollinger Bands if visible - USE ACTUAL SERIES DATA
    if (indicators.bb20 && bbUpperSeries && bbMiddleSeries && bbLowerSeries) {
      try {
        const upperData = bbUpperSeries.data();
        const middleData = bbMiddleSeries.data();
        const lowerData = bbLowerSeries.data();
        
        if (upperData && upperData.length > 0) {
          // Find closest BB points by time
          const upperPoint = upperData.reduce((closest, current) => {
            const currentDiff = Math.abs(current.time - time);
            const closestDiff = Math.abs(closest.time - time);
            return currentDiff < closestDiff ? current : closest;
          });
          
          const middlePoint = middleData.reduce((closest, current) => {
            const currentDiff = Math.abs(current.time - time);
            const closestDiff = Math.abs(closest.time - time);
            return currentDiff < closestDiff ? current : closest;
          });
          
          const lowerPoint = lowerData.reduce((closest, current) => {
            const currentDiff = Math.abs(current.time - time);
            const closestDiff = Math.abs(closest.time - time);
            return currentDiff < closestDiff ? current : closest;
          });
          
          if (upperPoint && Math.abs(upperPoint.time - time) <= 86400) {
            const upperY = candleSeries.priceToCoordinate(upperPoint.value);
            if (upperY !== null && Math.abs(py - upperY) <= tolerancePx) {
              console.log('[EOD] ✅ BB Upper hit detected at', upperPoint.value);
              return { type: 'bb', band: 'upper', value: upperPoint.value, name: 'BB Upper' };
            }
          }
          
          if (middlePoint && Math.abs(middlePoint.time - time) <= 86400) {
            const middleY = candleSeries.priceToCoordinate(middlePoint.value);
            if (middleY !== null && Math.abs(py - middleY) <= tolerancePx) {
              console.log('[EOD] ✅ BB Middle hit detected at', middlePoint.value);
              return { type: 'bb', band: 'middle', value: middlePoint.value, name: 'BB Middle' };
            }
          }
          
          if (lowerPoint && Math.abs(lowerPoint.time - time) <= 86400) {
            const lowerY = candleSeries.priceToCoordinate(lowerPoint.value);
            if (lowerY !== null && Math.abs(py - lowerY) <= tolerancePx) {
              console.log('[EOD] ✅ BB Lower hit detected at', lowerPoint.value);
              return { type: 'bb', band: 'lower', value: lowerPoint.value, name: 'BB Lower' };
            }
          }
        }
      } catch (error) {
        console.log('[EOD] ⚠️ BB detection error:', error);
      }
    }
    
    console.log('[EOD] ❌ No indicator hit detected');
    return null;
  }

  function hitTestTrendlines(px, py, tolerancePx = 10){
    for (const [id, rec] of trendSeriesById.entries()){
      const t = rec.data;
      const x1 = chart.timeScale().timeToCoordinate(t.startTime);
      const y1 = candleSeries.priceToCoordinate(t.startPrice);
      const x2 = chart.timeScale().timeToCoordinate(t.endTime);
      const y2 = candleSeries.priceToCoordinate(t.endPrice);
      if ([x1,y1,x2,y2].some(v => v == null)) continue;
      const d = pointSegDist(px, py, x1,y1,x2,y2);
      if (d <= tolerancePx) return { id, where: d < 8 ? 'segment' : 'near' };
    }
    return null;
  }

  function hitTestLevel(px, py, tolerancePx = 8){
    for (const [id, rec] of levelLineById.entries()){
      const y = candleSeries.priceToCoordinate(rec.data.price);
      if (y == null) continue;
      if (Math.abs(py - y) <= tolerancePx) return { id };
    }
    return null;
  }

  function createAlert() {
    const checkedRadio = document.querySelector('input[name="alertDirection"]:checked');
    
    if (!checkedRadio) {
      log('Error: Please select a direction for the alert');
      return;
    }
    
    // For level alerts, we need a price. For dynamic alerts, we don't.
    if (!alertDialogState.isDynamic && !alertDialogState.targetPrice) {
      log('Error: Invalid price for level alert');
      return;
    }
    
    const direction = checkedRadio.value;
    const alertData = {
      id: 'alert_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
      symbol: currentSymbol,
      timeframe: currentTimeframe,
      direction, // 'above' or 'below'
      targetInfo: alertDialogState.targetInfo,
      timestamp: Date.now(),
      triggered: false
    };
    
    // Store different data based on alert type following required schema
    if (alertDialogState.isDynamic) {
      // For dynamic alerts, store element reference according to proper schema
      switch(alertDialogState.type) {
        case 'trendline':
          // Trendline schema: { type: 'trendline', id, start: {time, price}, end: {time, price}, direction, symbol, timeframe, timestamp }
          alertData.type = 'trendline';
          alertData.id = alertDialogState.data.id;
          alertData.start = {
            time: alertDialogState.data.startTime,
            price: alertDialogState.data.startPrice
          };
          alertData.end = {
            time: alertDialogState.data.endTime,
            price: alertDialogState.data.endPrice
          };
          break;
        case 'ema':
          // EMA schema: { type: 'ema', period: 200, direction, symbol, timeframe, timestamp }
          alertData.type = 'ema';
          alertData.period = 200; // EMA(200)
          break;
        case 'bb_upper':
        case 'bb_middle':
        case 'bb_lower':
          // BB schema: { type: 'bb', band: 'upper|middle|lower', period: 20, stddev: 2, direction, symbol, timeframe, timestamp }
          alertData.type = 'bb';
          alertData.band = alertDialogState.type.replace('bb_', ''); // Extract 'upper', 'middle', or 'lower'
          alertData.period = 20; // BB(20,2)
          alertData.stddev = 2;
          break;
        case 'bb':
          // Handle unified BB type with band property
          alertData.type = 'bb';
          alertData.band = alertDialogState.data.band || 'upper';
          alertData.period = 20; // BB(20,2)
          alertData.stddev = 2;
          break;
      }
    } else if (alertDialogState.type === 'drawing_level' || alertDialogState.type === 'drawing_trendline') {
      // Drawing alerts: store drawing reference and target price
      alertData.type = alertDialogState.type;
      alertData.price = alertDialogState.targetPrice;
      alertData.drawingData = {
        drawing: alertDialogState.data.drawing,
        symbol: alertDialogState.data.symbol,
        timeframe: alertDialogState.data.timeframe,
        targetPrice: alertDialogState.data.targetPrice
      };
    } else {
      // Level schema: { type: 'level', price, direction, symbol, timeframe, timestamp }
      alertData.type = 'level';
      alertData.price = alertDialogState.targetPrice;
      alertData.lineData = alertDialogState.data;
    }
    
    // Add comprehensive console logging for verification
    console.log('[EOD] 🔔 Creating Alert with Schema Verification:');
    console.log('[EOD] Alert Type:', alertData.type);
    console.log('[EOD] Direction:', alertData.direction);
    console.log('[EOD] Complete Alert Object:', JSON.stringify(alertData, null, 2));
    
    // Verify required fields per schema
    switch(alertData.type) {
      case 'level':
        console.log('[EOD] ✅ Level Alert - Price:', alertData.price);
        break;
      case 'trendline':
        console.log('[EOD] ✅ Trendline Alert - ID:', alertData.id);
        console.log('[EOD] ✅ Trendline Start:', alertData.start);
        console.log('[EOD] ✅ Trendline End:', alertData.end);
        break;
      case 'ema':
        console.log('[EOD] ✅ EMA Alert - Period:', alertData.period);
        break;
      case 'bb':
        console.log('[EOD] ✅ BB Alert - Band:', alertData.band);
        console.log('[EOD] ✅ BB Alert - Period:', alertData.period);
        console.log('[EOD] ✅ BB Alert - Stddev:', alertData.stddev);
        break;
      case 'drawing_level':
        console.log('[EOD] ✅ Drawing Level Alert - Price:', alertData.price);
        break;
      case 'drawing_trendline':
        console.log('[EOD] ✅ Drawing Trendline Alert - Price:', alertData.price);
        console.log('[EOD] ✅ Drawing Data:', alertData.drawingData);
        break;
    }
    
    // Store in localStorage
    const existingAlerts = JSON.parse(localStorage.getItem('eod-alerts') || '[]');
    existingAlerts.push(alertData);
    localStorage.setItem('eod-alerts', JSON.stringify(existingAlerts));
    
    console.log('[EOD] 💾 Alert saved to localStorage. Total alerts:', existingAlerts.length);
    
    // Show confirmation
    const directionText = direction === 'above' ? 'above' : 'below';
    if (alertDialogState.isDynamic) {
      log(`✅ Alert set: Close ${directionText} ${alertDialogState.targetInfo}`);
    } else {
      log(`✅ Alert set: Close ${directionText} $${alertDialogState.targetPrice.toFixed(2)} on ${alertDialogState.targetInfo}`);
    }
    
    // Hide dialog
    hideAlertDialog();
    
    // Update any alert displays if they exist
    updateAlertsDisplay();
  }

  // ==== INTELLIGENT TRENDLINE EXTENSION SYSTEM ====
  
  /**
   * Determines which endpoint is top vs bottom based on Y-coordinates (prices)
   * and calculates intelligent extension direction
   */
  function getExtensionDirection(trendline, dragMode) {
    if (!trendline || (dragMode !== 'start' && dragMode !== 'end')) {
      return null;
    }
    
    const startPrice = trendline.startPrice;
    const endPrice = trendline.endPrice;
    
    // Determine which endpoint is being dragged and its relative position
    const isDraggingStart = dragMode === 'start';
    const isDraggingEnd = dragMode === 'end';
    
    // Determine if dragged endpoint is the lower or higher price point
    const draggedPrice = isDraggingStart ? startPrice : endPrice;
    const otherPrice = isDraggingStart ? endPrice : startPrice;
    
    // Smart extension logic:
    // - Dragging lower endpoint → extend downward into future
    // - Dragging upper endpoint → extend upward into future
    const isDraggingLowerPoint = draggedPrice < otherPrice;
    const isDraggingUpperPoint = draggedPrice > otherPrice;
    
    return {
      isDraggingStart,
      isDraggingEnd,
      isDraggingLowerPoint,
      isDraggingUpperPoint,
      draggedPrice,
      otherPrice,
      shouldExtendDown: isDraggingLowerPoint,
      shouldExtendUp: isDraggingUpperPoint
    };
  }
  
  /**
   * Calculates extended trendline points based on slope and drag direction
   * FIXED: Enforces direction based on drag position, not line slope
   */
  function calculateExtendedTrendline(trendline, extensionInfo, currentTime, currentPrice) {
    if (!trendline || !extensionInfo) {
      return null;
    }
    
    const { startTime, startPrice, endTime, endPrice } = trendline;
    const { isDraggingStart, shouldExtendDown, shouldExtendUp } = extensionInfo;
    
    // Update the dragged endpoint first
    let updatedStartTime = isDraggingStart ? currentTime : startTime;
    let updatedStartPrice = isDraggingStart ? currentPrice : startPrice;
    let updatedEndTime = isDraggingStart ? endTime : currentTime;
    let updatedEndPrice = isDraggingStart ? endPrice : currentPrice;
    
    // Calculate time difference for slope calculation
    const timeDiff = updatedEndTime - updatedStartTime;
    if (timeDiff === 0) return null;
    
    // ARCHITECT'S FIX 1: Force absolute slope, then apply direction
    let m = Math.abs((updatedEndPrice - updatedStartPrice) / timeDiff);
    let sign = extensionInfo.shouldExtendUp ? 1 : -1;
    let extSlope = sign * m;
    
    // Get visible time range to determine extension bounds
    const visibleRange = chart.timeScale().getVisibleRange();
    if (!visibleRange) return null;
    
    const visibleDuration = visibleRange.to - visibleRange.from;
    const extensionDuration = Math.min(visibleDuration * 0.3, 86400 * 10); // Max 10 days or 30% of visible range
    
    // ARCHITECT'S FIX 2: Always use rightmost endpoint as base for future projection
    let baseTime = Math.max(updatedStartTime, updatedEndTime);  // Most future time
    let basePrice = (baseTime === updatedStartTime) ? updatedStartPrice : updatedEndPrice;
    
    // Calculate extension into future only
    let futureTime = baseTime + extensionDuration;
    let futurePrice = basePrice + extSlope * extensionDuration;
    
    // ARCHITECT'S FIX 3: Apply consistent clamping (removed asymmetry)
    // Remove clamping entirely to avoid autoscale explosions and ensure symmetry
    
    // Set up the final extended trendline points
    let extendedStartTime, extendedStartPrice, extendedEndTime, extendedEndPrice;
    
    if (baseTime === updatedStartTime) {
      // Start is rightmost, so start stays as base, extend end point
      extendedStartTime = updatedStartTime;
      extendedStartPrice = updatedStartPrice;
      extendedEndTime = futureTime;
      extendedEndPrice = futurePrice;
    } else {
      // End is rightmost, so end stays as base, but we still project forward
      extendedStartTime = updatedStartTime;
      extendedStartPrice = updatedStartPrice;
      extendedEndTime = futureTime;
      extendedEndPrice = futurePrice;
    }
    
    return {
      startTime: extendedStartTime,
      startPrice: extendedStartPrice,
      endTime: extendedEndTime,
      endPrice: extendedEndPrice,
      isExtended: true,
      extensionDirection: shouldExtendDown ? 'down' : shouldExtendUp ? 'up' : 'none'
    };
  }

  // ==== BUTTERY SMOOTH POINTER EVENT SYSTEM ====
  // ===== UNIFIED POINTER EVENT HANDLERS WITH CAPTURE =====
  // Legacy pointerDownState removed - using unifiedDragState now

  function onPointerDown(e) {
    // DISABLE DRAG SYSTEM DURING DRAWING MODE TO PREVENT CONFLICTS
    if (unifiedDragState.drawingMode) {
      console.log('[EOD] 🚫 Drag system disabled during drawing mode - tool:', unifiedDragState.drawingTool, 'mode:', unifiedDragState.drawingMode);
      return; // Let the drawing system handle this
    }
    
    const chartContainer = document.getElementById('chart');
    
    // Get coordinates with safety checks
    const rect = chartContainer.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const time = safeLogicalToTime(safeChartToLogical(px));
    const price = safeChartToPrice(py);
    
    // Reset unified drag state
    resetDragState();
    
    // Set initial coordinates
    unifiedDragState.startX = px;
    unifiedDragState.startY = py;
    unifiedDragState.currentX = px;
    unifiedDragState.currentY = py;
    unifiedDragState.startTime = time;
    unifiedDragState.startPrice = price;
    unifiedDragState.currentTime = time;
    unifiedDragState.currentPrice = price;
    
    logDragOperation('start', { px, py, time, price });
    
    // Validate coordinates early
    if (!time || !price || !isFinite(time) || !isFinite(price) || price <= 0) {
      console.log('[EOD] ⚠️ Invalid coordinates - skipping drag setup');
      return;
    }
    
    // Use screen-space hit testing for reliable selection
    const trendlineHit = hitTestTrendlines(px, py);
    const levelHit = hitTestLevel(px, py);
    
    if (trendlineHit) {
      const t = trendSeriesById.get(trendlineHit.id)?.data;
      if (t) {
        // Store original data for restoration
        unifiedDragState.originalData = {
          startTime: t.startTime,
          startPrice: t.startPrice,
          endTime: t.endTime,
          endPrice: t.endPrice
        };
        
        // Check if clicking near endpoints for resize - VALIDATE THESE TOO
        const x1 = chart.timeScale().timeToCoordinate(t.startTime);
        const y1 = candleSeries.priceToCoordinate(t.startPrice);
        const x2 = chart.timeScale().timeToCoordinate(t.endTime);
        const y2 = candleSeries.priceToCoordinate(t.endPrice);
        
        // Validate endpoint coordinates before using them
        if ([x1, y1, x2, y2].some(v => v == null || !isFinite(v))) {
          console.log('[EOD] ⚠️ Invalid trendline endpoint coordinates - skipping drag');
          return;
        }
        
        const startDist = Math.hypot(px - x1, py - y1);
        const endDist = Math.hypot(px - x2, py - y2);
        
        // Determine drag mode
        if (startDist <= 12) {
          unifiedDragState.dragMode = 'trendline-start';
        } else if (endDist <= 12) {
          unifiedDragState.dragMode = 'trendline-end';
        } else {
          unifiedDragState.dragMode = 'trendline-move';
        }
        
        unifiedDragState.dragType = 'trendline';
        unifiedDragState.dragTarget = { id: trendlineHit.id, data: t };
        unifiedDragState.pendingDrag = { type: 'trendline', id: trendlineHit.id };
        
        // Set pointer capture for reliable event tracking
        try {
          chartContainer.setPointerCapture(e.pointerId);
          unifiedDragState.capturedElement = chartContainer;
        } catch (captureError) {
          console.warn('[EOD] ⚠️ Could not set pointer capture:', captureError);
        }
        
        chartContainer.style.cursor = unifiedDragState.dragMode === 'trendline-move' ? 'grab' : 'nw-resize';
        console.log('[EOD] ✅ Trendline drag setup:', unifiedDragState.dragMode);
        e.preventDefault();
        e.stopPropagation();
      }
    } else if (levelHit) {
      // Setup level drag
      const levels = getLevelsForSymbol(currentSymbol, currentTimeframe);
      const level = levels.find(l => l.id === levelHit.id);
      if (level) {
        unifiedDragState.originalData = { price: level.price };
        unifiedDragState.dragType = 'level';
        unifiedDragState.dragMode = 'level-move';
        unifiedDragState.dragTarget = { id: levelHit.id, data: level };
        unifiedDragState.pendingDrag = { type: 'level', id: levelHit.id };
        
        // Set pointer capture
        try {
          chartContainer.setPointerCapture(e.pointerId);
          unifiedDragState.capturedElement = chartContainer;
        } catch (captureError) {
          console.warn('[EOD] ⚠️ Could not set pointer capture:', captureError);
        }
        
        chartContainer.style.cursor = 'ns-resize';
        console.log('[EOD] ✅ Level drag setup');
        e.preventDefault();
        e.stopPropagation();
      }
    }
  }

  function onPointerMove(e) {
    lastPointer = e; // stash the latest event
    
    // Update current coordinates with safety checks
    const rect = document.getElementById('chart').getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const time = safeLogicalToTime(safeChartToLogical(px));
    const price = safeChartToPrice(py);
    
    unifiedDragState.currentX = px;
    unifiedDragState.currentY = py;
    unifiedDragState.currentTime = time;
    unifiedDragState.currentPrice = price;
    
    // Track movement for click vs drag detection
    if (!unifiedDragState.isDragging && unifiedDragState.pendingDrag) {
      const deltaX = Math.abs(px - unifiedDragState.startX);
      const deltaY = Math.abs(py - unifiedDragState.startY);
      const totalMovement = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
      
      // If movement exceeds threshold, activate drag mode
      if (totalMovement > 5) {
        unifiedDragState.isDragging = true;
        unifiedDragState.hasMoved = true;
        
        logDragOperation('activated', { 
          totalMovement, 
          deltaX, 
          deltaY,
          threshold: 5,
          pendingType: unifiedDragState.pendingDrag.type
        });
        
        // NOW start performance freezing for drag
        freezeDuringDrag(true);
      }
    }
    
    if (rafToken) return; // already queued
    rafToken = requestAnimationFrame(processPointer);
  }

  function processPointer() {
    rafToken = null;
    if (!lastPointer || !unifiedDragState.isDragging) return;
    
    const rect = document.getElementById('chart').getBoundingClientRect();
    const px = lastPointer.clientX - rect.left;
    const py = lastPointer.clientY - rect.top;
    const time = safeLogicalToTime(safeChartToLogical(px));
    const price = safeChartToPrice(py);
    
    // Validate coordinates
    if (time === null || price === null) {
      console.warn('[EOD] ⚠️ Invalid coordinates during drag, skipping frame');
      return;
    }
    
    // Update current position
    unifiedDragState.currentX = px;
    unifiedDragState.currentY = py;
    unifiedDragState.currentTime = time;
    unifiedDragState.currentPrice = price;
    
    logDragOperation('move', { px, py, time, price });
    
    // Handle different drag types
    if (unifiedDragState.dragType === 'level') {
      handleLevelDrag();
    } else if (unifiedDragState.dragType === 'trendline') {
      handleTrendlineDrag();
    }
  }
  
  function handleLevelDrag() {
    if (!unifiedDragState.dragTarget || !Number.isFinite(unifiedDragState.currentPrice)) return;
    
    const levels = getLevelsForSymbol(currentSymbol, currentTimeframe);
    const levelIndex = levels.findIndex(l => l.id === unifiedDragState.dragTarget.id);
    
    if (levelIndex >= 0 && levels[levelIndex].price !== unifiedDragState.currentPrice) {
      levels[levelIndex].price = unifiedDragState.currentPrice;
      
      // Update visual representation
      const rec = levelLineById.get(unifiedDragState.dragTarget.id);
      if (rec) {
        try { candleSeries.removePriceLine(rec.line); } catch {}
        const line = candleSeries.createPriceLine({
          price: unifiedDragState.currentPrice,
          color: levels[levelIndex].selected ? '#22d3ee' : (levels[levelIndex].color || '#60a5fa'),
          lineWidth: levels[levelIndex].selected ? 5 : 2,
          lineStyle: 0, 
          axisLabelVisible: true, 
          title: `Level ${unifiedDragState.currentPrice.toFixed(2)}`
        });
        levelLineById.set(unifiedDragState.dragTarget.id, { line, data: levels[levelIndex] });
      }
    }
  }
  
  function handleTrendlineDrag() {
    if (!unifiedDragState.dragTarget || 
        !Number.isFinite(unifiedDragState.currentTime) || 
        !Number.isFinite(unifiedDragState.currentPrice)) return;
    
    const trendlines = getTrendlinesForSymbol(currentSymbol, currentTimeframe);
    const trendlineIndex = trendlines.findIndex(t => t.id === unifiedDragState.dragTarget.id);
    
    if (trendlineIndex < 0) return;
    
    const trendline = trendlines[trendlineIndex];
    const original = unifiedDragState.originalData;
    let trendlineData = null;
    
    if (unifiedDragState.dragMode === 'trendline-move') {
      // Move entire trendline
      const deltaTime = unifiedDragState.currentTime - unifiedDragState.startTime;
      const deltaPrice = unifiedDragState.currentPrice - unifiedDragState.startPrice;
      
      trendline.startTime = original.startTime + deltaTime;
      trendline.startPrice = original.startPrice + deltaPrice;
      trendline.endTime = original.endTime + deltaTime;
      trendline.endPrice = original.endPrice + deltaPrice;
      
      // Prevent times from going negative
      if (trendline.startTime < 0) {
        const correction = -trendline.startTime;
        trendline.startTime += correction;
        trendline.endTime += correction;
      }
      
      trendlineData = [
        { time: trendline.startTime, value: trendline.startPrice },
        { time: trendline.endTime, value: trendline.endPrice }
      ];
      
    } else if (unifiedDragState.dragMode === 'trendline-start') {
      trendline.startTime = unifiedDragState.currentTime;
      trendline.startPrice = unifiedDragState.currentPrice;
      
      // Calculate intelligent extension
      const extensionInfo = getExtensionDirection(trendline, 'start');
      if (extensionInfo) {
        const extendedTrendline = calculateExtendedTrendline(trendline, extensionInfo, unifiedDragState.currentTime, unifiedDragState.currentPrice);
        if (extendedTrendline) {
          trendlineData = [
            { time: extendedTrendline.startTime, value: extendedTrendline.startPrice },
            { time: extendedTrendline.endTime, value: extendedTrendline.endPrice }
          ];
        }
      }
      
      if (!trendlineData) {
        trendlineData = [
          { time: trendline.startTime, value: trendline.startPrice },
          { time: trendline.endTime, value: trendline.endPrice }
        ];
      }
      
    } else if (unifiedDragState.dragMode === 'trendline-end') {
      trendline.endTime = unifiedDragState.currentTime;
      trendline.endPrice = unifiedDragState.currentPrice;
      
      // Calculate intelligent extension
      const extensionInfo = getExtensionDirection(trendline, 'end');
      if (extensionInfo) {
        const extendedTrendline = calculateExtendedTrendline(trendline, extensionInfo, unifiedDragState.currentTime, unifiedDragState.currentPrice);
        if (extendedTrendline) {
          trendlineData = [
            { time: extendedTrendline.startTime, value: extendedTrendline.startPrice },
            { time: extendedTrendline.endTime, value: extendedTrendline.endPrice }
          ];
        }
      }
      
      if (!trendlineData) {
        trendlineData = [
          { time: trendline.startTime, value: trendline.startPrice },
          { time: trendline.endTime, value: trendline.endPrice }
        ];
      }
    }
    
    // Update visual representation
    if (trendlineData) {
      const rec = trendSeriesById.get(unifiedDragState.dragTarget.id);
      if (rec) {
        try { chart.removeSeries(rec.series); } catch {}
        
        const newSeries = chart.addLineSeries({
          color: trendline.color,
          lineWidth: 2,
          lineStyle: trendline.style || 0,
          priceLineVisible: false,
          lastValueVisible: false
        });
        
        newSeries.setData(trendlineData);
        trendSeriesById.set(unifiedDragState.dragTarget.id, { series: newSeries, data: trendline });
      }
    }
  }

  function onPointerUp(e) {
    const chartContainer = document.getElementById('chart');
    
    // Always stop performance freezing on pointer up
    freezeDuringDrag(false);
    
    const rect = chartContainer.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const time = safeLogicalToTime(safeChartToLogical(px));
    const price = safeChartToPrice(py);
    
    // Calculate gesture stats
    const deltaX = Math.abs(px - unifiedDragState.startX);
    const deltaY = Math.abs(py - unifiedDragState.startY);
    const totalMovement = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
    
    const wasClick = !unifiedDragState.hasMoved && 
                     totalMovement < 5 && 
                     !unifiedDragState.drawingMode;
    
    logDragOperation('end', { 
      wasClick, 
      totalMovement, 
      deltaX, 
      deltaY,
      finalTime: time,
      finalPrice: price
    });
    
    if (wasClick) {
      // HANDLE CLICK - Check for alert setup
      if (time && price) {
        // Comprehensive detection in priority order:
        // 1. Check for trendline clicks (highest priority)
        const trendHit = detectTrendlineClick(px, py);
        if (trendHit) {
          showContextMenu(px + rect.left, py + rect.top, 'trendline', trendHit);
          resetDragState();
          return;
        }
        
        // 2. Check for indicator clicks (EMA, BB bands)
        const indicatorHit = detectIndicatorClick(px, py);
        if (indicatorHit) {
          showContextMenu(px + rect.left, py + rect.top, indicatorHit.type, indicatorHit);
          resetDragState();
          return;
        }
        
        // 3. Check for level clicks
        const levelHit = detectLevelClick(px, py);
        if (levelHit) {
          showContextMenu(px + rect.left, py + rect.top, 'level', levelHit);
          resetDragState();
          return;
        }
        
        // 4. If nothing hit, this is an empty area click - hide any open menus
        hideContextMenu();
      }
      
      resetDragState();
      return;
    }
    
    // HANDLE DRAG END - finalize: save to storage, rebuild handles once, clear drag states
    if (unifiedDragState.isDragging) {
      if (unifiedDragState.dragType === 'level') {
        saveLevelsForSymbol(currentSymbol, currentTimeframe, getLevelsForSymbol(currentSymbol, currentTimeframe));
        updateLineHandles();
        evaluateCurrentSignals();
        console.log('[EOD] 💾 Level drag completed & saved');

        updateLineHandles();
        evaluateCurrentSignals();
        console.log('[EOD] 💾 Trendline drag completed & saved');
      }
    }
    
    // Clean up state
    resetDragState();
    lastPointer = null;
    chartContainer.style.cursor = '';
  }

  // ===== ISOLATED DRAWING OVERLAY INITIALIZATION =====

    overlayCanvas = document.getElementById('drawing-overlay');

    overlayCtx = overlayCanvas.getContext('2d');
    
    // Set up high-DPI canvas with proper DPR handling
    function resizeOverlayCanvas() {
      const rect = overlayCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      overlayCanvas.width = rect.width * dpr;
      overlayCanvas.height = rect.height * dpr;
      // CRITICAL: Reset transform before scaling to prevent accumulation
      overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
      overlayCtx.scale(dpr, dpr);
      overlayCanvas.style.width = rect.width + 'px';
      overlayCanvas.style.height = rect.height + 'px';
      renderOverlay();
    }
    
    resizeOverlayCanvas();
    
    // Set up ResizeObserver for responsive canvas
    const resizeObserver = new ResizeObserver(entries => {
      resizeOverlayCanvas();
    });
    resizeObserver.observe(document.getElementById('chart'));
    
    // Subscribe to ALL chart changes for complete re-rendering
    chart.timeScale().subscribeVisibleLogicalRangeChange(() => renderOverlay());
    
    // Subscribe to chart size changes for Y coordinate updates
    const originalResize = chart.resize.bind(chart);
    chart.resize = (w, h) => {
      const result = originalResize(w, h);
      renderOverlay();
      return result;

    } else if (unifiedDragState.dragTarget.type === 'trendline') {
      // Trendline: Handle different drag modes
      const logical = chartToLogical(x);
      const price = chartToPrice(y);
      
      if (logical !== null && price !== null && !isNaN(logical) && !isNaN(price)) {
        if (overlayState.dragMode === 'move') {
          // Move entire trendline
          const deltaLogical = logical - chartToLogical(overlayState.dragStart.x);
          const deltaPrice = price - chartToPrice(overlayState.dragStart.y);
          
          if (!isNaN(deltaLogical) && !isNaN(deltaPrice)) {

            if (!overlayState.originalTrendline) {
              overlayState.originalTrendline = {
                x1Logical: drawing.x1Logical,
                y1Price: drawing.y1Price,
                x2Logical: drawing.x2Logical,
                y2Price: drawing.y2Price
              };
            }
            
            drawings.trendlines[index].x1Logical = overlayState.originalTrendline.x1Logical + deltaLogical;
            drawings.trendlines[index].y1Price = overlayState.originalTrendline.y1Price + deltaPrice;
            drawings.trendlines[index].x2Logical = overlayState.originalTrendline.x2Logical + deltaLogical;
            drawings.trendlines[index].y2Price = overlayState.originalTrendline.y2Price + deltaPrice;
            
            console.log('[EOD] 🎯 Trendline moved by delta:', deltaLogical.toFixed(1), deltaPrice.toFixed(2));
          }
        } else if (overlayState.dragMode === 'resize-start') {
          // Resize from start point

          drawings.trendlines[index].y1Price = price;
          console.log('[EOD] 🎯 Trendline start point moved to:', logical.toFixed(1), price.toFixed(2));

  // ===== HOVER DETECTION AND HIT TESTING =====
  let hoveredDrawing = null;
  let selectedDrawing = null;
  
  function setupHoverDetection() {
    
    // Use chart container for hover detection to not interfere with chart interactions
    const chartContainer = document.getElementById('chart');
    
    chartContainer.addEventListener('mousemove', (e) => {
      // Store mouse event for cursor positioning
      window.lastMouseEvent = e;

        if (hoveredDrawing) {
          hoveredDrawing = null;
          updateHoverFeedback();
        }
        return;
      }
      
      const drawing = hitTestDrawings(x, y);
      
      if (drawing !== hoveredDrawing) {
        hoveredDrawing = drawing;

      }
    });
    
    overlayCanvas.addEventListener('mouseleave', () => {

  }
  
  function hitTestDrawings(x, y) {
    const drawings = getDrawingsForSymbol(currentSymbol, currentTimeframe);
    const tolerance = 8; // pixels
    
    // Test trendlines first (more specific)
    for (let i = 0; i < drawings.trendlines.length; i++) {
      const trendline = drawings.trendlines[i];
      if (hitTestTrendline(x, y, trendline, tolerance)) {
        return { type: 'trendline', index: i, drawing: trendline };
      }
    }
    
    // Test levels
    for (let i = 0; i < drawings.levels.length; i++) {
      const level = drawings.levels[i];
      if (hitTestLevel(x, y, level, tolerance)) {
        return { type: 'level', index: i, drawing: level };
      }
    }
    
    return null;
  }
  
  function hitTestLevel(x, y, level, tolerance) {
    if (!level || typeof level.price === 'undefined') return false;
    
    const levelY = priceToChart(level.price);
    if (levelY === null || isNaN(levelY)) return false;
    
    return Math.abs(y - levelY) <= tolerance;
  }
  
  function hitTestTrendline(x, y, trendline, tolerance) {
    const x1 = logicalToChart(trendline.x1Logical);
    const y1 = priceToChart(trendline.y1Price);
    const x2 = logicalToChart(trendline.x2Logical);
    const y2 = priceToChart(trendline.y2Price);
    
    if (x1 === null || y1 === null || x2 === null || y2 === null ||
        isNaN(x1) || isNaN(y1) || isNaN(x2) || isNaN(y2)) {
      return false;
    }
    
    return distanceToLineSegment(x, y, x1, y1, x2, y2) <= tolerance;
  }
  
  function distanceToLineSegment(px, py, x1, y1, x2, y2) {
    const A = px - x1;
    const B = py - y1;
    const C = x2 - x1;
    const D = y2 - y1;
    
    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    
    if (lenSq === 0) return Math.sqrt(A * A + B * B); // Point case
    
    let param = dot / lenSq;
    param = Math.max(0, Math.min(1, param)); // Clamp to segment
    
    const xx = x1 + param * C;
    const yy = y1 + param * D;
    
    const dx = px - xx;
    const dy = py - yy;
    
    return Math.sqrt(dx * dx + dy * dy);
  }
  
  function updateHoverFeedback() {
    // SMART POINTER EVENTS: Only intercept when hovering lines or in drawing mode
    const shouldIntercept = unifiedDragState.drawingMode || hoveredDrawing || overlayState.isDragging;
    overlayCanvas.style.pointerEvents = shouldIntercept ? 'auto' : 'none';
    
    // Update cursor based on state
    if (overlayState.isDragging) {
      // Keep drag cursor during drag
      return;
    } else if (hoveredDrawing) {
      // Show appropriate cursor for the hovered drawing
      if (hoveredDrawing.type === 'level') {
        overlayCanvas.style.cursor = 'ns-resize';
      } else if (hoveredDrawing.type === 'trendline') {
        // Check if we're near endpoints for resize cursor
        const rect = overlayCanvas.getBoundingClientRect();
        const mouseEvent = window.lastMouseEvent;
        if (mouseEvent && rect) {
          const x = mouseEvent.clientX - rect.left;
          const y = mouseEvent.clientY - rect.top;
          
          const drawing = hoveredDrawing.drawing;
          const x1 = logicalToChart(drawing.x1Logical);
          const y1 = priceToChart(drawing.y1Price);
          const x2 = logicalToChart(drawing.x2Logical);
          const y2 = priceToChart(drawing.y2Price);
          
          if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
            const startDist = Math.hypot(x - x1, y - y1);
            const endDist = Math.hypot(x - x2, y - y2);
            const resizeThreshold = 12;
            
            if (startDist <= resizeThreshold || endDist <= resizeThreshold) {
              overlayCanvas.style.cursor = 'nw-resize';
            } else {
              overlayCanvas.style.cursor = 'move';
            }
          } else {
            overlayCanvas.style.cursor = 'move';
          }
        } else {
          overlayCanvas.style.cursor = 'move';
        }
      }
    } else {
      overlayCanvas.style.cursor = unifiedDragState.drawingMode ? 'crosshair' : 'default';
    }
  }

      // Initialize drag state

      unifiedDragState.startX = x;
      unifiedDragState.startY = y;
      unifiedDragState.dragTarget = drawing;
      unifiedDragState.dragType = 'overlay-' + (drawing?.type || 'unknown');
      
      // For trendlines, determine if we're near an endpoint for resizing
      if (drawing.type === 'trendline') {
        const x1 = logicalToChart(drawing.drawing.x1Logical);
        const y1 = priceToChart(drawing.drawing.y1Price);
        const x2 = logicalToChart(drawing.drawing.x2Logical);
        const y2 = priceToChart(drawing.drawing.y2Price);
        
        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
          const startDist = Math.hypot(x - x1, y - y1);
          const endDist = Math.hypot(x - x2, y - y2);
          const resizeThreshold = 12;
          
          if (startDist <= resizeThreshold) {
            overlayState.dragMode = 'resize-start';
            overlayCanvas.style.cursor = 'nw-resize';
          } else if (endDist <= resizeThreshold) {
            overlayState.dragMode = 'resize-end';
            overlayCanvas.style.cursor = 'nw-resize';
          } else {
            overlayState.dragMode = 'move';
            overlayCanvas.style.cursor = 'move';
          }
        }
      } else {
        // Level - only move up/down
        overlayState.dragMode = 'move';
        overlayCanvas.style.cursor = 'ns-resize';

      renderOverlay(); // Re-render to show selection

  function handleRightClickLine(e, drawing) {
    // Calculate price at cursor position for the drawing
    let targetPrice;
    if (drawing.type === 'level') {

      // Calculate trendline price at cursor position
      const rect = overlayCanvas.getBoundingClientRect();

  function calculateTrendlinePrice(trendline, screenX) {
    const x1 = logicalToChart(trendline.x1Logical);
    const x2 = logicalToChart(trendline.x2Logical);
    const y1Price = trendline.y1Price;
    const y2Price = trendline.y2Price;
    
    if (x1 === null || x2 === null || x1 === x2) {
      return y1Price; // Fallback to first point
    }
    
    // Linear interpolation along the line
    const ratio = (screenX - x1) / (x2 - x1);
    return y1Price + ratio * (y2Price - y1Price);
  }

  // ===== OVERLAY DRAWING PERSISTENCE SYSTEM =====
  function getOverlayStorageKey(symbol, timeframe) {
    return `eod-overlay-drawings-${symbol}-${timeframe}`;
  }
  
  function getDrawingsForSymbol(symbol, timeframe) {
    const key = getOverlayStorageKey(symbol, timeframe);
    const cacheKey = `${symbol}-${timeframe}`;
    
    // Return cached version if available
    if (overlayDrawings[cacheKey]) {
      return overlayDrawings[cacheKey];
    }
    
    // Load from localStorage
    try {
      const stored = localStorage.getItem(key);
      const drawings = stored ? JSON.parse(stored) : { levels: [], trendlines: [] };
      
      // Ensure proper structure
      if (!drawings.levels) drawings.levels = [];
      if (!drawings.trendlines) drawings.trendlines = [];
      
      // Cache for performance
      overlayDrawings[cacheKey] = drawings;
      return drawings;
    } catch (error) {
      console.warn('[EOD] Error loading overlay drawings:', error);
      const defaultDrawings = { levels: [], trendlines: [] };
      overlayDrawings[cacheKey] = defaultDrawings;
      return defaultDrawings;
    }
  }
  
  function saveDrawingsForSymbol(symbol, timeframe, drawings) {
    const key = getOverlayStorageKey(symbol, timeframe);
    const cacheKey = `${symbol}-${timeframe}`;
    
    try {
      // Update cache
      overlayDrawings[cacheKey] = drawings;
      
      // Persist to localStorage
      localStorage.setItem(key, JSON.stringify(drawings));
      
      console.log(`[EOD] 💾 Overlay drawings saved for ${symbol} ${timeframe}:`, {
        levels: drawings.levels.length,
        trendlines: drawings.trendlines.length
      });
    } catch (error) {
      console.error('[EOD] Error saving overlay drawings:', error);

  function setupOverlayCanvasDPI() {
    if (!overlayCanvas || !overlayCtx) return;
    
    const chartContainer = document.getElementById('chart');
    const rect = chartContainer.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    
    // Set canvas size in CSS pixels
    overlayCanvas.style.width = rect.width + 'px';
    overlayCanvas.style.height = rect.height + 'px';
    
    // Set actual canvas size in memory (scaled for DPI)
    overlayCanvas.width = rect.width * dpr;
    overlayCanvas.height = rect.height * dpr;
    
    // Scale the drawing context for DPI
    overlayCtx.scale(dpr, dpr);
    
    console.log(`[EOD] 📐 Canvas DPI setup: ${rect.width}x${rect.height} CSS, ${overlayCanvas.width}x${overlayCanvas.height} actual, DPR: ${dpr}`);

  // ===== ENHANCED CANVAS SYNCHRONIZATION =====
  function syncOverlayCanvasDimensions() {
    if (!overlayCanvas || !overlayCtx) {
      console.warn('[EOD] 🚨 Cannot sync canvas dimensions - canvas not initialized');
      return;
    }
    
    const chartContainer = document.getElementById('chart');
    if (!chartContainer) {
      console.warn('[EOD] 🚨 Chart container not found');
      return;
    }
    
    const rect = chartContainer.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    
    // Check if dimensions have actually changed to avoid unnecessary redraws
    const currentWidth = parseFloat(overlayCanvas.style.width) || 0;
    const currentHeight = parseFloat(overlayCanvas.style.height) || 0;
    
    if (Math.abs(currentWidth - rect.width) < 1 && Math.abs(currentHeight - rect.height) < 1) {
      return; // No significant change, skip update
    }
    
    console.log(`[EOD] 📐 Syncing canvas dimensions: ${rect.width}x${rect.height}`);
    
    // Reset transform to prevent accumulation
    overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
    
    // Update canvas dimensions
    overlayCanvas.style.width = rect.width + 'px';
    overlayCanvas.style.height = rect.height + 'px';
    overlayCanvas.width = rect.width * dpr;
    overlayCanvas.height = rect.height * dpr;
    
    // Reapply DPI scaling
    overlayCtx.scale(dpr, dpr);
    
    console.log(`[EOD] ✅ Canvas dimensions synced: ${rect.width}x${rect.height} CSS, DPR: ${dpr}`);
  }
  
  let renderOverlayThrottle = null;

  // ===== COORDINATE ACCURACY VALIDATION =====
  function validateCoordinateAccuracy() {
    if (!chart || !candleSeries || !overlayCanvas) {
      return; // Not ready for validation
    }
    
    // Validate a sample of level lines for coordinate drift
    const levels = getLevelsForSymbol(currentSymbol, currentTimeframe) || [];
    const trendlines = getTrendlinesForSymbol(currentSymbol, currentTimeframe) || [];
    
    let driftDetected = false;
    
    // Check level coordinate accuracy
    levels.slice(0, 3).forEach(level => { // Check first 3 levels
      const expectedY = safePriceToChart(level.price);
      if (expectedY !== null) {
        const actualPrice = safeChartToPrice(expectedY);
        if (actualPrice !== null) {
          const priceDrift = Math.abs(actualPrice - level.price);
          const relativeDrift = priceDrift / level.price;
          
          if (relativeDrift > 0.001) { // 0.1% drift threshold
            console.warn(`[EOD] 🚨 Level coordinate drift detected: ${level.price} vs ${actualPrice} (${(relativeDrift * 100).toFixed(3)}%)`);
            driftDetected = true;
          }
        }
      }
    });
    
    // Check trendline coordinate accuracy
    trendlines.slice(0, 2).forEach(trendline => { // Check first 2 trendlines
      const startX = safeTimeToLogical(trendline.startTime);
      const startY = safePriceToChart(trendline.startPrice);
      
      if (startX !== null && startY !== null) {
        const actualTime = safeLogicalToTime(startX);
        const actualPrice = safeChartToPrice(startY);
        
        if (actualTime !== null && actualPrice !== null) {
          const timeDrift = Math.abs(actualTime - trendline.startTime);
          const priceDrift = Math.abs(actualPrice - trendline.startPrice);
          const relativePriceDrift = priceDrift / trendline.startPrice;
          
          if (relativePriceDrift > 0.001) { // 0.1% drift threshold
            console.warn(`[EOD] 🚨 Trendline coordinate drift detected: ${trendline.startPrice} vs ${actualPrice} (${(relativePriceDrift * 100).toFixed(3)}%)`);
            driftDetected = true;
          }
        }
      }
    });
    
    if (driftDetected) {
      console.log('[EOD] 🔄 Coordinate drift detected - triggering corrective overlay redraw');
      renderOverlay();
    }
  }
  
  function renderOverlayImmediate() {
    if (!overlayCanvas || !overlayCtx) {
      if (!initializeOverlayCanvas()) return;
    }
    
    // Get canvas dimensions
    const chartContainer = document.getElementById('chart');
    const rect = chartContainer.getBoundingClientRect();
    
    // Clear canvas
    overlayCtx.clearRect(0, 0, rect.width, rect.height);
    
    // Get current drawings
    const drawings = getDrawingsForSymbol(currentSymbol, currentTimeframe);
    
    // Render levels
    drawings.levels.forEach(level => {
      const y = safePriceToChart(level.price);
      if (y !== null && !isNaN(y)) {
        overlayCtx.save();
        overlayCtx.strokeStyle = level.color || '#60a5fa';
        overlayCtx.lineWidth = 2;
        overlayCtx.setLineDash([]);
        overlayCtx.beginPath();
        overlayCtx.moveTo(0, y);
        overlayCtx.lineTo(rect.width, y);
        overlayCtx.stroke();
        overlayCtx.restore();
      }
    });
    
    // Render trendlines
    drawings.trendlines.forEach(trendline => {
      const x1 = safeLogicalToChart(safeChartToLogical(chart.timeScale().timeToCoordinate(trendline.startTime)));
      const y1 = safePriceToChart(trendline.startPrice);
      const x2 = safeLogicalToChart(safeChartToLogical(chart.timeScale().timeToCoordinate(trendline.endTime)));
      const y2 = safePriceToChart(trendline.endPrice);
      
      if (x1 !== null && y1 !== null && x2 !== null && y2 !== null &&
          !isNaN(x1) && !isNaN(y1) && !isNaN(x2) && !isNaN(y2)) {
        overlayCtx.save();
        overlayCtx.strokeStyle = trendline.color || '#f59e0b';
        overlayCtx.lineWidth = 2;
        overlayCtx.setLineDash([]);
        overlayCtx.beginPath();
        overlayCtx.moveTo(x1, y1);
        overlayCtx.lineTo(x2, y2);
        overlayCtx.stroke();
        overlayCtx.restore();
      }
    });
    
    // Render selection handles if needed
    if (selectedDrawing) {
      renderSelectionHandles(selectedDrawing);
    }
  }

  function renderSelectionHandles(selectedObj) {
    if (!overlayCtx) return;
    
    overlayCtx.save();
    overlayCtx.fillStyle = '#ffffff';
    overlayCtx.strokeStyle = '#3b82f6';
    overlayCtx.lineWidth = 2;
    
    const drawing = selectedObj.drawing;
    
    if (selectedObj.type === 'level') {
      const y = safePriceToChart(drawing.price);
      if (y !== null && !isNaN(y)) {
        const chartContainer = document.getElementById('chart');
        const rect = chartContainer.getBoundingClientRect();
        const x = rect.width / 2;
        
        // Draw selection handle
        overlayCtx.beginPath();
        overlayCtx.arc(x, y, 6, 0, 2 * Math.PI);
        overlayCtx.fill();
        overlayCtx.stroke();
      }
    } else if (selectedObj.type === 'trendline') {
      const x1 = chart.timeScale().timeToCoordinate(drawing.startTime);
      const y1 = safePriceToChart(drawing.startPrice);
      const x2 = chart.timeScale().timeToCoordinate(drawing.endTime);
      const y2 = safePriceToChart(drawing.endPrice);
      
      if (x1 !== null && y1 !== null && x2 !== null && y2 !== null &&
          !isNaN(x1) && !isNaN(y1) && !isNaN(x2) && !isNaN(y2)) {
        // Draw handles at both endpoints
        overlayCtx.beginPath();
        overlayCtx.arc(x1, y1, 6, 0, 2 * Math.PI);
        overlayCtx.fill();
        overlayCtx.stroke();
        
        overlayCtx.beginPath();
        overlayCtx.arc(x2, y2, 6, 0, 2 * Math.PI);
        overlayCtx.fill();
        overlayCtx.stroke();
      }
    }
    
    overlayCtx.restore();
  }

  // ---- Indicator calculations
  function ema(values, period) {
    if (values.length === 0) return [];
    const k = 2 / (period + 1);
    let emaVal = values[0].close;
    const out = [{ time: values[0].time, value: emaVal }];
    for (let i = 1; i < values.length; i++) {
      emaVal = values[i].close * k + emaVal * (1 - k);
      out.push({ time: values[i].time, value: emaVal });
    }
    return out;
  }

  function bollingerBands(values, period, stdDev) {
    if (!values || values.length < period) return { upper: [], middle: [], lower: [] };
    
    const upper = [], middle = [], lower = [];
    
    for (let i = period - 1; i < values.length; i++) {
      // Calculate SMA for middle band
      const slice = values.slice(i - period + 1, i + 1);
      
      // Ensure all values are valid numbers
      const validSlice = slice.filter(bar => bar && typeof bar.close === 'number' && !isNaN(bar.close));
      if (validSlice.length !== slice.length) continue; // Skip if any invalid data
      
      const sma = validSlice.reduce((sum, bar) => sum + bar.close, 0) / validSlice.length;
      
      // Calculate standard deviation
      const variance = validSlice.reduce((sum, bar) => sum + Math.pow(bar.close - sma, 2), 0) / validSlice.length;
      const std = Math.sqrt(variance);
      
      const time = values[i].time;
      if (time && !isNaN(sma) && !isNaN(std)) {
        middle.push({ time, value: sma });
        upper.push({ time, value: sma + (stdDev * std) });
        lower.push({ time, value: sma - (stdDev * std) });
      }
    }
    
    return { upper, middle, lower };
  }

  // Weekly resampling (aggregates daily bars to weekly candles)
  function resampleWeekly(daily) {
    if (!daily || !daily.length) return [];
    
    const weekly = [];
    let currentWeek = null;
    let weekData = null;
    
    // Helper function to get ISO week number
    function getISOWeek(timestamp) {
      const date = new Date(timestamp * 1000);
      date.setUTCHours(0, 0, 0, 0);
      const dayOfWeek = (date.getUTCDay() + 6) % 7; // Monday = 0
      date.setUTCDate(date.getUTCDate() - dayOfWeek + 3); // Thursday of current week
      const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
      const weekNumber = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
      return date.getUTCFullYear() + "-" + weekNumber;
    }
    
    for (const bar of daily) {
      if (!bar || typeof bar.time !== 'number') continue;
      
      const week = getISOWeek(bar.time);
      
      if (week !== currentWeek) {
        // Start new week
        if (weekData) weekly.push(weekData);
        weekData = {
          time: bar.time,
          open: bar.open,
          high: bar.high,
          low: bar.low,
          close: bar.close
        };
        currentWeek = week;
      } else {
        // Update current week data
        weekData.high = Math.max(weekData.high, bar.high);
        weekData.low = Math.min(weekData.low, bar.low);
        weekData.close = bar.close; // Last close of the week
      }
    }
    
    // Add final week
    if (weekData) weekly.push(weekData);
    
    return weekly;
  }

  // Monthly resampling (aggregates daily bars to monthly candles)
  function resampleMonthly(daily) {
    if (!daily || !daily.length) return [];
    
    const monthly = [];
    let currentMonth = null;
    let monthData = null;
    
    // Helper function to get year-month key
    function getYearMonth(timestamp) {
      const date = new Date(timestamp * 1000);
      return date.getUTCFullYear() + "-" + String(date.getUTCMonth() + 1).padStart(2, '0');
    }
    
    for (const bar of daily) {
      if (!bar || typeof bar.time !== 'number') continue;
      
      const month = getYearMonth(bar.time);
      
      if (month !== currentMonth) {
        // Start new month
        if (monthData) monthly.push(monthData);
        monthData = {
          time: bar.time,
          open: bar.open,
          high: bar.high,
          low: bar.low,
          close: bar.close
        };
        currentMonth = month;
      } else {
        // Update current month data
        monthData.high = Math.max(monthData.high, bar.high);
        monthData.low = Math.min(monthData.low, bar.low);
        monthData.close = bar.close; // Last close of the month
      }
    }
    
    // Add final month
    if (monthData) monthly.push(monthData);
    
    return monthly;
  }

  async function fetchBars(symbol, days = 4000) {
    const url = `${API}/eod?symbol=${encodeURIComponent(symbol)}&days=${days}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const json = await r.json();
    // Tiingo adapter -> Lightweight Charts
    return (json.data || []).map(b => ({
      time: b.time, open: b.open, high: b.high, low: b.low, close: b.close
    }));
  }
